name: Release

# Baut bei jedem Push auf main (also nach jedem gemergten Pull Request) die
# Windows- und die macOS-App und veröffentlicht beide als GitHub-Release.
# Dazu kommt die Android-Lite-App (APK), aber nur, wenn die Signier-Secrets
# gesetzt sind (siehe docs/android-signierung.md). Der Android-Job blockiert
# das Release nie: Windows und macOS werden auch ohne APK veröffentlicht.
# Ebenso die Linux-Bundles (x64 und arm64 für den Raspberry Pi): fehlt eins,
# erscheint das Release trotzdem.
# DartLab fragt beim Start nach dem neuesten Release und bietet den Download
# an (siehe docs/build-anleitung.md, Abschnitt „Updates“).
#
# Version (SemVer): x.y kommt aus pubspec.yaml, die letzte Stelle z zählt
# der Workflow selbst hoch (höchstes vorhandene Tag v<x.y>.z + 1, sonst die
# Zahl aus pubspec.yaml). Neue Funktionen: y in pubspec.yaml erhöhen, z beginnt
# dann wieder bei 0. Build-Nummer = Laufnummer dieses Workflows (Android
# braucht sie als versionCode, sie steigt immer).
# Tag: v<x.y.z>+<Build>, z. B. v0.11.2+33, Titel „DartLab 0.11.2“. Die Build-
# Nummer steht im Tag, weil schon installierte Apps (bis Build 30) den
# Update-Hinweis nur zeigen, wenn sie sie dort finden.
on:
  push:
    branches: [main]
    # Reine Doku-Änderungen ergeben keine neue App.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

# Releases nacheinander, nie abbrechen (sonst fehlt eine Version).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Version bestimmen
        id: v
        run: |
          base=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)
          if [ -z "$base" ]; then
            echo "::error::Keine Version in pubspec.yaml gefunden"
            exit 1
          fi
          minor="${base%.*}"
          patch="${base##*.}"
          # Höchste letzte Stelle unter den Tags v<x.y>.z bzw. v<x.y>.z+<Build>.
          # Alte Tags wie v0.10.0-b12 passen nicht und zählen nicht mit.
          last=$(git ls-remote --tags origin "refs/tags/v$minor.*" \
            | sed -nE "s#^.*refs/tags/v${minor//./\\.}\.([0-9]+)(\+[0-9]+)?\$#\1#p" \
            | sort -n | tail -n1)
          if [ -n "$last" ] && [ $((last + 1)) -gt "$patch" ]; then
            patch=$((last + 1))
          fi
          version="$minor.$patch"
          build="${{ github.run_number }}"
          {
            echo "version=$version"
            echo "build=$build"
            echo "tag=v$version+$build"
          } >> "$GITHUB_OUTPUT"
          echo "DartLab $version, Build $build (Tag v$version+$build)"

  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Bauen
        run: >-
          flutter build windows --release
          --build-name=${{ needs.meta.outputs.version }}
          --build-number=${{ needs.meta.outputs.build }}
          --dart-define=DARTLAB_VERSION=${{ needs.meta.outputs.version }}
          --dart-define=DARTLAB_BUILD=${{ needs.meta.outputs.build }}
      - name: Zip packen
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath DartLab-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: DartLab-windows.zip
          if-no-files-found: error

  macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Bauen
        run: >-
          flutter build macos --release
          --build-name=${{ needs.meta.outputs.version }}
          --build-number=${{ needs.meta.outputs.build }}
          --dart-define=DARTLAB_VERSION=${{ needs.meta.outputs.version }}
          --dart-define=DARTLAB_BUILD=${{ needs.meta.outputs.build }}
      - name: App packen
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/DartLab.app DartLab-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: DartLab-macos.zip
          if-no-files-found: error

  android:
    needs: meta
    runs-on: ubuntu-latest
    # Hängt der Android-Build, soll das Release nicht ewig auf ihn warten.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # Der Schlüssel liegt als Secret im Repository. Nur wenn alle vier
      # Secrets gesetzt sind, entsteht eine APK für das Release. Eine mit dem
      # Debug-Schlüssel signierte APK darf nie veröffentlicht werden, denn
      # spätere Updates ließen sich dann nicht mehr darüber installieren.
      - name: Signierschlüssel einrichten
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dartlab-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release-Schlüssel gefunden."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Android-Release ohne APK::Die Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS und ANDROID_KEY_PASSWORD sind nicht alle gesetzt. Das Release enthält deshalb keine Android-APK (siehe docs/android-signierung.md)."
          fi
      - name: Bauen
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/dartlab-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: >-
          flutter build apk --release
          --build-name=${{ needs.meta.outputs.version }}
          --build-number=${{ needs.meta.outputs.build }}
          --dart-define=DARTLAB_LITE=true
          --dart-define=DARTLAB_VERSION=${{ needs.meta.outputs.version }}
          --dart-define=DARTLAB_BUILD=${{ needs.meta.outputs.build }}
      - name: Signatur prüfen
        if: steps.signing.outputs.signed == 'true'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner nicht gefunden, die Signatur lässt sich nicht prüfen."
            exit 1
          fi
          # Erst in eine Datei, damit ein Fehler von apksigner den Schritt abbricht.
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > apksigner.txt
          cat apksigner.txt
          if grep -qi "Android Debug" apksigner.txt; then
            echo "::error::Die APK ist mit dem Debug-Schlüssel signiert und wird nicht veröffentlicht."
            exit 1
          fi
      - name: APK umbenennen
        run: cp build/app/outputs/flutter-apk/app-release.apk DartLab-Lite-android.apk
      - name: APK als Release-Artefakt ablegen
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: DartLab-Lite-android.apk
          if-no-files-found: error
      # Ohne Release-Schlüssel nur als Test-Artefakt. Der Name passt nicht auf
      # release-*, deshalb landet die Datei nie im Release.
      - name: Unsignierte Test-APK ablegen
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-test-unsigned
          path: DartLab-Lite-android.apk
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Linux-Bauwerkzeuge
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # Für arm64 gibt es kein fertiges Flutter-Archiv.
      - if: matrix.arch == 'arm64'
        name: Flutter (arm64, per git)
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Bauen
        run: >-
          flutter build linux --release
          --build-name=${{ needs.meta.outputs.version }}
          --build-number=${{ needs.meta.outputs.build }}
          --dart-define=DARTLAB_VERSION=${{ needs.meta.outputs.version }}
          --dart-define=DARTLAB_BUILD=${{ needs.meta.outputs.build }}
      # Ein Ordner „dartlab“ im Archiv, damit das Installationsskript ihn
      # einfach austauschen kann.
      - name: Bundle packen
        run: |
          cp -r build/linux/${{ matrix.arch }}/release/bundle dartlab
          tar -czf DartLab-linux-${{ matrix.arch }}.tar.gz dartlab
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: DartLab-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: [meta, windows, macos, android, linux]
    # Läuft auch, wenn der Android- oder ein Linux-Job fehlschlägt.
    # Windows und macOS müssen aber erfolgreich gewesen sein.
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      BUILD: ${{ needs.meta.outputs.build }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Ganze Historie und alle Tags für die Änderungsliste.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Änderungen seit dem letzten Release
        run: |
          # Voriges Release: das nächste Versions-Tag auf main vor diesem Commit
          # (jedes Release markiert den main-Stand, aus dem es gebaut wurde).
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --first-parent "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="$prev..$GITHUB_SHA"
            limit=40
          else
            range="$GITHUB_SHA"
            limit=10
          fi
          echo "Vorheriges Release: ${prev:-keins}"
          : > notes.md
          git log --first-parent --format='%H%x09%s' -n "$limit" "$range" | while IFS=$'\t' read -r sha subject; do
            if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
              # Gemergter PR: der PR-Titel steht in der ersten Zeile der Nachricht.
              title=$(git log -1 --format=%b "$sha" | sed -n '/[^[:space:]]/{p;q;}')
              echo "- ${title:-$subject} (#${BASH_REMATCH[1]})" >> notes.md
            elif [[ "$subject" =~ ^Merge[[:space:]] ]]; then
              continue
            else
              echo "- $subject" >> notes.md
            fi
          done
          if [ ! -s notes.md ]; then
            echo "- Kleinere Verbesserungen" >> notes.md
          fi
          {
            echo
            echo "> Windows: DartLab-windows.zip entpacken und den Inhalt in den DartLab-Ordner kopieren."
            echo "> macOS: DartLab-macos.zip öffnen und DartLab.app in den Programme-Ordner ziehen."
            if [ -f dist/DartLab-Lite-android.apk ]; then
              echo "> Android (Lite): DartLab-Lite-android.apk herunterladen und installieren; die vorhandene App wird aktualisiert."
            fi
            if ls dist/DartLab-linux-*.tar.gz >/dev/null 2>&1; then
              echo "> Linux/Raspberry Pi: DartLab-linux-arm64.tar.gz (Pi 4/5, 64-Bit) bzw. DartLab-linux-x64.tar.gz entpacken und dartlab/dartlab starten (docs/linux.md)."
            fi
            echo "> iPhone/iPad: auf dem Mac git pull und neu bauen (docs/build-anleitung.md)."
          } >> notes.md
          cat notes.md
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(dist/DartLab-windows.zip dist/DartLab-macos.zip)
          # Linux-Bundles, soweit gebaut (blockieren das Release nie).
          for f in dist/DartLab-linux-x64.tar.gz dist/DartLab-linux-arm64.tar.gz; do
            if [ -f "$f" ]; then
              files+=("$f")
            else
              echo "::warning::$(basename "$f") fehlt im Release (Linux-Job fehlgeschlagen)."
            fi
          done
          # Die Android-APK gibt es nur mit Release-Schlüssel (siehe Android-Job).
          if [ -f dist/DartLab-Lite-android.apk ]; then
            files+=(dist/DartLab-Lite-android.apk)
          else
            echo "::warning::Keine Android-APK im Release (Secrets fehlen oder der Android-Job ist fehlgeschlagen)."
          fi
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DartLab $VERSION" \
            --notes-file notes.md \
            --latest
