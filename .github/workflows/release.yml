name: Release

# Baut bei jedem Push auf main (also nach jedem gemergten Pull Request) die
# Windows- und die macOS-App und veröffentlicht beide als GitHub-Release.
# Dazu kommt die Android-Lite-App (APK), aber nur, wenn die Signier-Secrets
# gesetzt sind (siehe docs/android-signierung.md). Der Android-Job blockiert
# das Release nie: Windows und macOS werden auch ohne APK veröffentlicht.
# DartLab fragt beim Start nach dem neuesten Release und bietet den Download
# an (siehe docs/build-anleitung.md, Abschnitt „Updates“).
#
# Version: x.y.z aus pubspec.yaml, Build-Nummer = Laufnummer dieses
# Workflows. Tag: v<x.y.z>-b<Laufnummer>, z. B. v0.10.0-b12.
on:
  push:
    branches: [main]
    # Reine Doku-Änderungen ergeben keine neue App.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

# Releases nacheinander, nie abbrechen (sonst fehlt eine Version).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Version bestimmen
        id: v
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)
          if [ -z "$version" ]; then
            echo "::error::Keine Version in pubspec.yaml gefunden"
            exit 1
          fi
          build="${{ github.run_number }}"
          {
            echo "version=$version"
            echo "build=$build"
            echo "tag=v$version-b$build"
          } >> "$GITHUB_OUTPUT"
          echo "DartLab $version, Build $build"

  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Bauen
        run: >-
          flutter build windows --release
          --build-name=${{ needs.meta.outputs.version }}
          --build-number=${{ needs.meta.outputs.build }}
          --dart-define=DARTLAB_VERSION=${{ needs.meta.outputs.version }}
          --dart-define=DARTLAB_BUILD=${{ needs.meta.outputs.build }}
      - name: Zip packen
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath DartLab-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: DartLab-windows.zip
          if-no-files-found: error

  macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Bauen
        run: >-
          flutter build macos --release
          --build-name=${{ needs.meta.outputs.version }}
          --build-number=${{ needs.meta.outputs.build }}
          --dart-define=DARTLAB_VERSION=${{ needs.meta.outputs.version }}
          --dart-define=DARTLAB_BUILD=${{ needs.meta.outputs.build }}
      - name: App packen
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/DartLab.app DartLab-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: DartLab-macos.zip
          if-no-files-found: error

  android:
    needs: meta
    runs-on: ubuntu-latest
    # Hängt der Android-Build, soll das Release nicht ewig auf ihn warten.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # Der Schlüssel liegt als Secret im Repository. Nur wenn alle vier
      # Secrets gesetzt sind, entsteht eine APK für das Release. Eine mit dem
      # Debug-Schlüssel signierte APK darf nie veröffentlicht werden, denn
      # spätere Updates ließen sich dann nicht mehr darüber installieren.
      - name: Signierschlüssel einrichten
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dartlab-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release-Schlüssel gefunden."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Android-Release ohne APK::Die Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS und ANDROID_KEY_PASSWORD sind nicht alle gesetzt. Das Release enthält deshalb keine Android-APK (siehe docs/android-signierung.md)."
          fi
      - name: Bauen
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/dartlab-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: >-
          flutter build apk --release
          --build-name=${{ needs.meta.outputs.version }}
          --build-number=${{ needs.meta.outputs.build }}
          --dart-define=DARTLAB_LITE=true
          --dart-define=DARTLAB_VERSION=${{ needs.meta.outputs.version }}
          --dart-define=DARTLAB_BUILD=${{ needs.meta.outputs.build }}
      - name: Signatur prüfen
        if: steps.signing.outputs.signed == 'true'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner nicht gefunden, die Signatur lässt sich nicht prüfen."
            exit 1
          fi
          # Erst in eine Datei, damit ein Fehler von apksigner den Schritt abbricht.
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > apksigner.txt
          cat apksigner.txt
          if grep -qi "Android Debug" apksigner.txt; then
            echo "::error::Die APK ist mit dem Debug-Schlüssel signiert und wird nicht veröffentlicht."
            exit 1
          fi
      - name: APK umbenennen
        run: cp build/app/outputs/flutter-apk/app-release.apk DartLab-Lite-android.apk
      - name: APK als Release-Artefakt ablegen
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: DartLab-Lite-android.apk
          if-no-files-found: error
      # Ohne Release-Schlüssel nur als Test-Artefakt. Der Name passt nicht auf
      # release-*, deshalb landet die Datei nie im Release.
      - name: Unsignierte Test-APK ablegen
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-test-unsigned
          path: DartLab-Lite-android.apk
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [meta, windows, macos, android]
    # Läuft auch, wenn der Android-Job fehlschlägt oder übersprungen wird.
    # Windows und macOS müssen aber erfolgreich gewesen sein.
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      BUILD: ${{ needs.meta.outputs.build }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Ganze Historie und alle Tags für die Änderungsliste.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Änderungen seit dem letzten Release
        run: |
          # Letztes Release-Tag nach Build-Nummer (v0.10.0-b12 → 12).
          prev=$(git tag --list 'v*-b*' | sed -nE 's/^(.*-b([0-9]+))$/\2 \1/p' | sort -n | tail -n1 | cut -d' ' -f2)
          if [ -n "$prev" ]; then
            range="$prev..$GITHUB_SHA"
            limit=40
          else
            range="$GITHUB_SHA"
            limit=10
          fi
          echo "Vorheriges Release: ${prev:-keins}"
          : > notes.md
          git log --first-parent --format='%H%x09%s' -n "$limit" "$range" | while IFS=$'\t' read -r sha subject; do
            if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
              # Gemergter PR: der PR-Titel steht in der ersten Zeile der Nachricht.
              title=$(git log -1 --format=%b "$sha" | sed -n '/[^[:space:]]/{p;q;}')
              echo "- ${title:-$subject} (#${BASH_REMATCH[1]})" >> notes.md
            elif [[ "$subject" =~ ^Merge[[:space:]] ]]; then
              continue
            else
              echo "- $subject" >> notes.md
            fi
          done
          if [ ! -s notes.md ]; then
            echo "- Kleinere Verbesserungen" >> notes.md
          fi
          {
            echo
            echo "> Windows: DartLab-windows.zip entpacken und den Inhalt in den DartLab-Ordner kopieren."
            echo "> macOS: DartLab-macos.zip öffnen und DartLab.app in den Programme-Ordner ziehen."
            if [ -f dist/DartLab-Lite-android.apk ]; then
              echo "> Android (Lite): DartLab-Lite-android.apk herunterladen und installieren; die vorhandene App wird aktualisiert."
            fi
            echo "> iPhone/iPad: auf dem Mac git pull und neu bauen (docs/build-anleitung.md)."
          } >> notes.md
          cat notes.md
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(dist/DartLab-windows.zip dist/DartLab-macos.zip)
          # Die Android-APK gibt es nur mit Release-Schlüssel (siehe Android-Job).
          if [ -f dist/DartLab-Lite-android.apk ]; then
            files+=(dist/DartLab-Lite-android.apk)
          else
            echo "::warning::Keine Android-APK im Release (Secrets fehlen oder der Android-Job ist fehlgeschlagen)."
          fi
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DartLab $VERSION (Build $BUILD)" \
            --notes-file notes.md \
            --latest
