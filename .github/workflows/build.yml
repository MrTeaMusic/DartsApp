name: Native Builds

# Baut die App für Windows, macOS, iOS (ohne Signatur) und die Android-Lite-App,
# damit Build-Fehler auf den Zielplattformen früh auffallen. Die Ergebnisse
# liegen als Artefakte am jeweiligen Lauf.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: dartlab-windows
          path: build/windows/x64/runner/Release/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: App packen
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/DartLab.app dartlab-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dartlab-macos
          path: dartlab-macos.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # Ohne Signatur nur zur Kontrolle, dass der Build durchläuft. Auf ein
      # Gerät kommt die App über Xcode (siehe docs/build-anleitung.md).
      - run: flutter build ios --release --no-codesign

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # Lite-Variante (nur Statistiken). Ohne Release-Schlüssel wird mit dem
      # Debug-Schlüssel signiert: nur zum Testen, nie veröffentlichen
      # (siehe docs/android-signierung.md).
      - run: flutter build apk --release --dart-define=DARTLAB_LITE=true
      - uses: actions/upload-artifact@v4
        with:
          name: dartlab-lite-android-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
