name: Alte Releases umbenennen

# Einmalig, von Hand starten (Actions › „Alte Releases umbenennen“ › Run workflow).
# Benennt die alten Releases v0.10.0-b1 … b30 nach Meilensteinen um
# (Liste unten im Schritt „Umbenennen“):
#   0.10 Runde 7, 0.11 Arena + Runde 8, 0.12 Cloud-Sync + Lite,
#   0.13 Haus-Elo/Board-Hilfe/Historie/Icons, 0.14 Linux/Vergleich/PDF/Teilen.
# Neues Tag: v<Version>+<Build> auf denselben Commit, Titel „DartLab <Version>“.
# Dateien bleiben am Release. Welches Release „neuestes“ ist, ändert sich nicht.
# Läuft gefahrlos mehrfach: schon umbenannte Releases werden übersprungen.
on:
  workflow_dispatch:
    inputs:
      probelauf:
        description: 'Nur anzeigen, nichts ändern'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  umbenennen:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      DRY: ${{ inputs.probelauf }}
    steps:
      - name: Umbenennen
        run: |
          set -euo pipefail
          map="1 0.10.0
          2 0.10.1
          3 0.10.2
          4 0.10.3
          5 0.10.4
          6 0.10.5
          7 0.11.0
          8 0.11.1
          9 0.11.2
          10 0.11.3
          11 0.11.4
          12 0.12.0
          13 0.12.1
          14 0.12.2
          15 0.12.3
          16 0.12.4
          17 0.13.0
          18 0.13.1
          19 0.13.2
          20 0.13.3
          21 0.13.4
          22 0.13.5
          23 0.13.6
          24 0.13.7
          25 0.14.0
          26 0.14.1
          27 0.14.2
          28 0.14.3
          29 0.14.4
          30 0.14.5"
          echo "$map" | while read -r n v; do
            old="v0.10.0-b$n"
            new="v$v+$n"
            if ! id=$(gh api "repos/$REPO/releases/tags/$old" --jq .id 2>/dev/null); then
              echo "übersprungen: $old gibt es nicht (mehr)"
              continue
            fi
            sha=$(gh api "repos/$REPO/git/ref/tags/$old" --jq .object.sha)
            echo "$old ($sha) → $new „DartLab $v“"
            if [ "$DRY" = "true" ]; then continue; fi
            # Neues Tag (falls ein früherer Lauf es schon angelegt hat, weiter).
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$new" -f sha="$sha" >/dev/null \
              || gh api "repos/$REPO/git/ref/tags/$new" >/dev/null
            gh api -X PATCH "repos/$REPO/releases/$id" -f tag_name="$new" -f name="DartLab $v" >/dev/null
            gh api -X DELETE "repos/$REPO/git/refs/tags/$old"
          done
          if [ "$DRY" = "true" ]; then
            echo "Probelauf: nichts geändert. Zum Umbenennen ohne Haken bei „Nur anzeigen“ starten."
          fi
